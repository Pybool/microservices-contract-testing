name: Pact Contract Testing

on:
  push:
    branches:
      - master

env:
  PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
  GITHUB_SHA: ${{ github.sha }}

jobs:
  consumer-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install & Test Node Consumer
        working-directory: consumer-node
        run: |
          npm install
          npm run test:pact
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}

      - name: Install & Test Orders Service
        working-directory: orders-service
        run: |
          npm install
          npm run test:pact
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}

  provider-verification:
    needs: consumer-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Provider dependencies
        working-directory: provider-python
        run: pip install -r requirements.txt

      - name: Verify Provider Python
        working-directory: provider-python
        run: pytest test_provider_pact.py -v
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}

      - name: Install Users Service dependencies
        working-directory: users-service
        run: pip install -r requirements.txt

      - name: Verify Users Service
        working-directory: users-service
        run: pytest test_provider_pact.py -v
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-results
          path: |
            **/pacts/*.json
            **/test-results/